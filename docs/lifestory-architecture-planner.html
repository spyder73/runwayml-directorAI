<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeStory Architecture Planner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --surface: #181a20;
      --surface-2: #20232b;
      --surface-3: #14161b;
      --line: #333844;
      --line-hot: #d4a756;
      --text: #f4efe6;
      --muted: #aaa39a;
      --dim: #777f8e;
      --accent: #74b8ad;
      --accent-2: #d4a756;
      --danger: #d97463;
      --good: #8bbf78;
      --lane-user: #3b536d;
      --lane-director: #674d85;
      --lane-tools: #795a35;
      --lane-state: #3f6f59;
      --lane-media: #765047;
      --lane-provider: #405d81;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 17, 20, 0.96);
      backdrop-filter: blur(12px);
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(21px, 3vw, 34px);
      line-height: 1.05;
      font-weight: 780;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      max-width: 980px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    .mode-toggle,
    .view-tab,
    .chip,
    .clear-button {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 6px;
      min-height: 34px;
      padding: 0 11px;
      font-size: 13px;
      font-weight: 720;
    }

    .mode-toggle.active,
    .view-tab.active,
    .chip.active {
      border-color: var(--line-hot);
      color: #ffe0a6;
      background: #2a2318;
    }

    .shell {
      max-width: 1800px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 12px;
      align-items: start;
    }

    .search-box {
      display: grid;
      gap: 8px;
    }

    .search-box input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 0 13px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      min-height: 28px;
      padding: 0 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(210px, 1fr));
      gap: 12px;
      align-items: start;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .lane {
      min-width: 210px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .lane-header {
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--surface-3);
    }

    .lane-title {
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .lane-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .lane-body {
      display: grid;
      gap: 9px;
      padding: 10px;
      min-height: 180px;
    }

    .card {
      position: relative;
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 8px;
      text-align: left;
      color: var(--text);
      width: 100%;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .card.active {
      border-color: var(--line-hot);
      box-shadow: 0 0 0 1px rgba(212, 167, 86, 0.34);
    }

    .card.dimmed {
      opacity: 0.36;
    }

    .card.upstream {
      border-color: var(--accent);
    }

    .card.downstream {
      border-color: var(--good);
    }

    .card-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: 820;
      line-height: 1.2;
    }

    .phase {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .card p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .mini-chip {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      max-width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 0 7px;
      color: var(--muted);
      font-size: 11px;
      background: rgba(0, 0, 0, 0.13);
      overflow-wrap: anywhere;
    }

    .mini-chip.hot {
      color: #ffe0a6;
      border-color: rgba(212, 167, 86, 0.35);
      background: rgba(212, 167, 86, 0.12);
    }

    .lane-user .lane-header { border-top: 3px solid var(--lane-user); }
    .lane-director .lane-header { border-top: 3px solid var(--lane-director); }
    .lane-tools .lane-header { border-top: 3px solid var(--lane-tools); }
    .lane-state .lane-header { border-top: 3px solid var(--lane-state); }
    .lane-media .lane-header { border-top: 3px solid var(--lane-media); }
    .lane-provider .lane-header { border-top: 3px solid var(--lane-provider); }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 12px;
    }

    .info-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .info-panel h2 {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-3);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-body {
      display: grid;
      gap: 9px;
      padding: 12px;
    }

    .row-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--surface-2);
      display: grid;
      gap: 7px;
    }

    .row-card h3 {
      font-size: 14px;
      line-height: 1.25;
    }

    .row-card p,
    .row-card li {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.36;
    }

    .row-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .matrix {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      display: block;
      overflow-x: auto;
    }

    .matrix th,
    .matrix td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 12px;
      line-height: 1.35;
      min-width: 150px;
    }

    .matrix th {
      color: var(--text);
      background: var(--surface-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
    }

    .matrix td {
      color: var(--muted);
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 50;
      width: min(560px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(102%);
      transition: transform 180ms ease;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-3);
    }

    .drawer-head-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }

    .drawer h2 {
      font-size: 22px;
      line-height: 1.12;
    }

    .drawer-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 800;
    }

    .drawer-body {
      overflow-y: auto;
      padding: 16px;
      display: grid;
      gap: 13px;
    }

    .detail-section {
      display: grid;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: var(--surface-2);
    }

    .detail-section h3 {
      color: var(--accent-2);
      font-size: 12px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .detail-section p,
    .detail-section li,
    .detail-section textarea {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.42;
    }

    .detail-section ul {
      margin: 0;
      padding-left: 18px;
    }

    .detail-section textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101114;
      color: var(--text);
      padding: 10px;
      outline: none;
    }

    .empty {
      color: var(--dim);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1280px) {
      .board {
        grid-template-columns: repeat(3, minmax(220px, 1fr));
      }

      .panel-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }
    }

    @media (max-width: 760px) {
      header,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .top-actions,
      .tabs {
        justify-content: flex-start;
      }

      .board,
      .panel-grid {
        grid-template-columns: 1fr;
      }

      .lane {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LifeStory Architecture Planner</h1>
      <p class="subtitle">A planning map for seeing the concepts, prompts, Director tools, DB state, OpenRouter calls, media jobs, and change hooks that fuel the software.</p>
    </div>
    <div class="top-actions">
      <button class="mode-toggle active" data-mode="product">Product language</button>
      <button class="mode-toggle" data-mode="engineering">Engineering detail</button>
      <button class="clear-button" id="clear-selection">Clear highlight</button>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <div class="search-box">
        <input id="search" type="search" placeholder="Search phase, prompt, tool, provider, DB table, code path, or change idea">
        <div class="filters" id="filters"></div>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>

    <section id="workflow-view" class="view active" aria-label="Workflow Map">
      <div class="board" id="workflow-board"></div>
    </section>

    <section id="prompts-view" class="view" aria-label="Prompt and LLM Calls"></section>
    <section id="tools-view" class="view" aria-label="Tool Matrix"></section>
    <section id="state-view" class="view" aria-label="State and Data"></section>
    <section id="changes-view" class="view" aria-label="Change Planner"></section>
  </main>

  <aside class="drawer" id="drawer" aria-live="polite">
    <div class="drawer-head">
      <div class="drawer-head-row">
        <div>
          <div class="phase" id="drawer-phase">Workflow</div>
          <h2 id="drawer-title">Select a card</h2>
        </div>
        <button class="drawer-close" id="drawer-close" aria-label="Close detail drawer">X</button>
      </div>
      <p class="subtitle" id="drawer-summary">Click a workflow card to see prompts, tools, DB writes, providers, risks, and change hooks.</p>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script>
    const architectureCatalog = {
      views: [
        { id: "workflow", label: "Workflow Map" },
        { id: "prompts", label: "Prompt & LLM Calls" },
        { id: "tools", label: "Tool Matrix" },
        { id: "state", label: "State & Data" },
        { id: "changes", label: "Change Planner" }
      ],
      lanes: [
        { id: "user-ui", title: "User/UI", className: "lane-user" },
        { id: "director-prompts", title: "Director prompts + OpenRouter calls", className: "lane-director" },
        { id: "ai-tools", title: "AI tools", className: "lane-tools" },
        { id: "story-state", title: "Story bucket + DB state", className: "lane-state" },
        { id: "media-dag", title: "Media production DAG", className: "lane-media" },
        { id: "providers-render", title: "External providers + render", className: "lane-provider" }
      ],
      phases: [
        {
          id: "session-start",
          phase: "Start",
          lane: "user-ui",
          title: "Session start",
          summary: "Creates a LifeStory session and chooses text or voice as the interview surface.",
          engineering: "Routes initialize session state, status, auth ownership, and the first Director message.",
          prompts: ["life-story-onboarding", "shared-director"],
          tools: [],
          db: ["sessions", "chat_history"],
          providers: [],
          code: ["src/app/api/pipeline/start/route.ts", "src/lib/pipeline.ts", "src/lib/db.ts"],
          failures: ["Unconfirmed auth blocks public sessions.", "Wrong host or route can hide app/landing split."],
          hooks: ["Add a new interview mode here by extending session start inputs and the session mode/status model."],
          upstream: [],
          downstream: ["text-interview", "voice-avatar-interview"]
        },
        {
          id: "text-interview",
          phase: "Interview",
          lane: "director-prompts",
          title: "Text interview Director loop",
          summary: "The Director asks one grounded question at a time and silently updates the private story material.",
          engineering: "streamText calls OpenRouter with status-specific prompt sources, tools, story context, uploads, and active reference requests.",
          prompts: ["shared-director", "life-story-profile", "life-story-deep-interview", "reference-upload", "sketch-feedback", "scene-outline"],
          tools: ["update_profile_bucket", "request_reference_upload", "add_reference_subject", "save_reference_description", "generate_memory_sketch", "propose_film_treatment", "propose_scene_outline"],
          db: ["chat_history", "story_profile", "story_entities", "memory_candidates", "reference_upload_requests"],
          providers: ["OpenRouter"],
          code: ["src/lib/pipeline.ts", "src/lib/ai/prompts/index.ts", "src/lib/ai/tools.ts"],
          failures: ["Tool-only turns need visible replies.", "Weak private context can make the Director lose the thread."],
          hooks: ["Add new Director tools in the AI tool schema, then decide which prompt phase may call them."],
          upstream: ["session-start"],
          downstream: ["story-bucket-updates", "reference-uploads", "memory-sketches", "treatment"]
        },
        {
          id: "voice-avatar-interview",
          phase: "Interview",
          lane: "user-ui",
          title: "Voice/avatar interview",
          summary: "Runway Characters provide a voice surface while the backend keeps the same story bucket and production ownership.",
          engineering: "Avatar tools wrap the same story operations with short RPC boundaries and client events for layout.",
          prompts: ["avatar-personality", "avatar-tool-definitions"],
          tools: ["avatar_update_profile", "avatar_request_reference", "show_upload_dropzone"],
          db: ["avatar_call_sessions", "avatar_call_events", "story_profile", "reference_upload_requests"],
          providers: ["Runway Characters"],
          code: ["src/app/api/avatar/session/route.ts", "src/lib/avatar/prompts.ts", "src/lib/avatar/tools.ts", "docs/runway-character/personality.md"],
          failures: ["Long-running media work must not block realtime calls.", "Voice handoff can drift if it bypasses backend state."],
          hooks: ["Add voice-only capabilities as avatar tools that call existing backend operations rather than page clicks."],
          upstream: ["session-start"],
          downstream: ["story-bucket-updates", "reference-uploads", "treatment"]
        },
        {
          id: "story-bucket-updates",
          phase: "Interview",
          lane: "story-state",
          title: "Story Bucket",
          summary: "The private structured memory of the film: profile, people, places, candidate moments, references, and readiness gaps.",
          engineering: "Tool calls write normalized rows that are reloaded into prompt context and SSE payloads.",
          prompts: ["shared-director", "life-story-profile", "life-story-deep-interview"],
          tools: ["update_profile_bucket", "add_reference_subject", "save_reference_description"],
          db: ["story_profile", "story_entities", "story_timeline_events", "memory_candidates", "reference_assets"],
          providers: [],
          code: ["src/lib/story-bucket.ts", "src/lib/types.ts", "src/lib/story-readiness.ts"],
          failures: ["Missing broad life map blocks strong outline planning.", "Abstract memories need visual follow-up before production."],
          hooks: ["Add a new story concept by extending bucket schema, tool schema, formatter, readiness checks, and prompt context."],
          upstream: ["text-interview", "voice-avatar-interview"],
          downstream: ["treatment", "scene-outline"]
        },
        {
          id: "reference-uploads",
          phase: "References",
          lane: "ai-tools",
          title: "Reference uploads and descriptions",
          summary: "The Director asks for protagonist, people, places, objects, or scene-specific references only when useful.",
          engineering: "Upload requests create checkpoint rows; uploads become reference_assets with stable tags and permissions.",
          prompts: ["reference-upload"],
          tools: ["request_reference_upload", "add_reference_subject", "save_reference_description"],
          db: ["reference_upload_requests", "reference_assets", "story_entities", "user_uploads"],
          providers: ["OpenRouter vision"],
          code: ["src/app/api/pipeline/upload/route.ts", "src/lib/production-references.ts", "src/lib/ai/tools.ts"],
          failures: ["Denied or description-only references must not be sent as Runway images.", "Prompt tags must match selected reference assets."],
          hooks: ["New reference types should define target_type, consent behavior, stable tag rules, and prompt rewrite behavior."],
          upstream: ["text-interview", "voice-avatar-interview"],
          downstream: ["memory-sketches", "outline-lock", "frame-generation"]
        },
        {
          id: "memory-sketches",
          phase: "Discovery",
          lane: "providers-render",
          title: "Memory sketches",
          summary: "Low-cost image sketches test whether a memory's visual and emotional direction feels right.",
          engineering: "The Director tool records a memory candidate, calls Runway image generation, stores media, and asks for feedback.",
          prompts: ["sketch-feedback"],
          tools: ["generate_memory_sketch", "save_sketch_feedback"],
          db: ["memory_candidates", "reference_assets", "media_assets", "chat_history"],
          providers: ["Runway gpt_image_2"],
          code: ["src/lib/pipeline.ts", "src/lib/runway.ts", "src/lib/media-assets.ts"],
          failures: ["Sketch errors should stay visible and recoverable without blocking the interview.", "Sketches are references, not production scenes."],
          hooks: ["Add alternate sketch providers behind generate_memory_sketch and media asset persistence."],
          upstream: ["story-bucket-updates", "reference-uploads"],
          downstream: ["treatment", "scene-outline"]
        },
        {
          id: "treatment",
          phase: "Pre-production",
          lane: "director-prompts",
          title: "Film treatment",
          summary: "The bridge between gathered life material and a scene plan: thesis, arc, motif, narrator style, ending, avoid list.",
          engineering: "Treatment tool persists a reviewable draft before scene outline generation is allowed.",
          prompts: ["scene-outline"],
          tools: ["propose_film_treatment"],
          db: ["story_treatments", "chat_history"],
          providers: ["OpenRouter"],
          code: ["src/lib/story-bucket.ts", "src/lib/treatment-reply.ts", "src/lib/pipeline-guards.ts"],
          failures: ["Outline production without treatment creates weak scene logic.", "Verbose treatment replies can pollute chat."],
          hooks: ["Add treatment fields only if they are also shown in review UI and fed into outline/narration prompts."],
          upstream: ["story-bucket-updates", "memory-sketches"],
          downstream: ["scene-outline"]
        },
        {
          id: "scene-outline",
          phase: "Pre-production",
          lane: "director-prompts",
          title: "Scene outline",
          summary: "The Director chooses ordered story beats, emotional purpose, visual direction, duration, and coverage intent.",
          engineering: "Scene outline rows are reviewable and revisable before expensive production begins.",
          prompts: ["scene-outline", "scene-outline-revision"],
          tools: ["propose_scene_outline", "revise_scene_outline"],
          db: ["scene_outline", "scene_outline_comments", "story_treatments"],
          providers: ["OpenRouter"],
          code: ["src/lib/story-bucket.ts", "src/lib/ai/prompts/scene-outline.ts", "src/app/api/pipeline/outline/route.ts"],
          failures: ["Scenes that contain multiple locations should be split here, not patched later with subscenes.", "Draft narratorText is not production voiceover."],
          hooks: ["New planning paths should add outline fields and reviewer UI before locking production scenes."],
          upstream: ["treatment", "reference-uploads"],
          downstream: ["outline-lock", "whole-film-narration"]
        },
        {
          id: "outline-lock",
          phase: "Production lock",
          lane: "story-state",
          title: "Outline lock",
          summary: "Freezes the approved scene plan into production rows and creates the durable media task graph.",
          engineering: "Backend guards validate treatment, outline completeness, consent, references, and cost before creating scenes and media_tasks.",
          prompts: [],
          tools: ["lock_scene_outline"],
          db: ["scenes", "media_tasks", "reference_assets", "sessions"],
          providers: [],
          code: ["src/lib/story-bucket.ts", "src/lib/media-tasks.ts", "src/lib/pipeline-guards.ts"],
          failures: ["Locking too early spends credits on weak plans.", "Reference resolution must happen before Runway prompt validation."],
          hooks: ["Add a new production path by extending media task DAG creation and session status transitions."],
          upstream: ["scene-outline"],

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function itemText(item) {
      return [
        item.id,
        item.phase,
        item.lane,
        item.title,
        item.summary,
        item.engineering,
        ...(item.prompts || []),
        ...(item.tools || []),
        ...(item.db || []),
        ...(item.providers || []),
        ...(item.code || []),
        ...(item.failures || []),
        ...(item.hooks || [])
      ].join(" ").toLowerCase();
    }

    function matchesQuery(item) {
      const query = state.query.trim().toLowerCase();
      if (!query) return true;
      return itemText(item).includes(query);
    }

    function matchesFilter(item) {
      if (state.filter === "all") return true;
      return item.lane === state.filter || item.phase === state.filter || (item.providers || []).includes(state.filter);
    }

    function visiblePhases() {
      return architectureCatalog.phases.filter((item) => matchesQuery(item) && matchesFilter(item));
    }

      tabs.innerHTML = architectureCatalog.views.map((view) => (

      )).join("");
      tabs.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeView = button.dataset.view;
          render();
        });
      });
    }

    function renderFilters() {
      const options = [
        { id: "all", label: "All" },
        ...architectureCatalog.lanes.map((lane) => ({ id: lane.id, label: lane.title })),

        { id: "Runway gpt_image_2", label: "Runway image" },
        { id: "Runway eleven_multilingual_v2", label: "Runway TTS" },
        { id: "Remotion", label: "Remotion" }

      filters.innerHTML = options.map((option) => (
        `<button class="chip ${state.filter === option.id ? "active" : ""}" data-filter="${escapeHtml(option.id)}">${escapeHtml(option.label)}</button>`

          state.filter = button.dataset.filter;
          render();
        });
      });
    }

    function summaryFor(item) {
      return state.mode === "engineering" ? item.engineering : item.summary;
    }

    function dependencyClass(item) {
      if (!state.selectedId) return "";
      if (item.id === state.selectedId) return "active";
      const selected = phaseById[state.selectedId];
      if (!selected) return "";
      if ((selected.upstream || []).includes(item.id)) return "upstream";
      if ((selected.downstream || []).includes(item.id)) return "downstream";
      if ((item.upstream || []).includes(state.selectedId)) return "downstream";
      if ((item.downstream || []).includes(state.selectedId)) return "upstream";
      return "dimmed";
    }

        ...(item.tools || []).slice(0, 2).map((value) => ({ value, hot: false })),
        ...(item.db || []).slice(0, 2).map((value) => ({ value, hot: false }))

      return `
        <button class="card ${dependencyClass(item)}" data-card-id="${escapeHtml(item.id)}">
          <div class="card-title">
            <span>${escapeHtml(item.title)}</span>
            <span class="phase">${escapeHtml(item.phase)}</span>
          </div>
          <p>${escapeHtml(summaryFor(item))}</p>
          <div class="chips">

          </div>
        </button>

      drawerBody.innerHTML = `
        <section class="detail-section">
          <h3>Concept / Purpose</h3>
          <p>${escapeHtml(item.summary)}</p>
          <p class="${state.mode === "engineering" ? "" : "hidden"}">${escapeHtml(item.engineering)}</p>
        </section>
        ${listSection("Prompt sources", item.prompts)}
        ${listSection("Director tools", item.tools)}
        ${listSection("DB tables / state", item.db)}
        ${listSection("Provider calls", item.providers)}
        ${listSection("Code references", item.code)}
        ${listSection("Failure modes", item.failures)}
        ${listSection("Change hooks", item.hooks)}
        ${listSection("Upstream", (item.upstream || []).map((id) => phaseById[id]?.title || id))}
        ${listSection("Downstream", (item.downstream || []).map((id) => phaseById[id]?.title || id))}
        <section class="detail-section">
          <h3>Your planning notes</h3>
          <textarea id="note-field" placeholder="Write advice, questions, or requested changes for this card. Notes stay in this browser.">${escapeHtml(localStorage.getItem(noteKey) || "")}</textarea>
        </section>
      `;
      const note = document.getElementById("note-field");
      note.addEventListener("input", () => localStorage.setItem(noteKey, note.value));
      drawer.classList.add("open");
    }

    function highlightDependencies(id) {
      state.selectedId = id;
      const item = phaseById[id];
      if (item) renderDrawer(item);
      renderWorkflow();
    }

    function bindCards(root) {
      root.querySelectorAll("[data-card-id]").forEach((button) => {
        button.addEventListener("click", () => highlightDependencies(button.dataset.cardId));
      });
    }

    function switchView() {
      document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
      document.getElementById(`${state.activeView}-view`).classList.add("active");
    }

    function render() {
      renderTabs();
      renderFilters();
      switchView();
      renderWorkflow();
      renderPrompts();
      renderTools();
      renderState();
      renderChanges();
    }

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((item) => item.classList.toggle("active", item.dataset.mode === state.mode));
        if (state.selectedId) renderDrawer(phaseById[state.selectedId]);
        render();
      });
    });

    search.addEventListener("input", () => {
      state.query = search.value;
      render();
    });

    document.getElementById("clear-selection").addEventListener("click", () => {
      state.selectedId = null;
      drawer.classList.remove("open");
      renderWorkflow();
    });

    document.getElementById("drawer-close").addEventListener("click", () => {
      drawer.classList.remove("open");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") drawer.classList.remove("open");
    });

    render();
  </script>
</body>
</html>
